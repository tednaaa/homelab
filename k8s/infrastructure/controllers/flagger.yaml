---
apiVersion: v1
kind: Namespace
metadata:
  name: flagger-system
  labels:
    name: flagger-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: flagger
  namespace: flagger-system
spec:
  interval: 1h
  url: https://flagger.app
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flagger-system
spec:
  interval: 10m
  chart:
    spec:
      chart: flagger
      version: '>=1.41.0'
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flagger-system
      interval: 1h
  values:
    meshProvider: nginx
    # If you have Prometheus, uncomment:
    # metricsServer: http://prometheus.monitoring:9090
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger-loadtester
  namespace: flagger-system
spec:
  interval: 10m
  chart:
    spec:
      chart: loadtester
      version: '>=0.31.0'
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flagger-system
      interval: 1h
  values:
    fullnameOverride: flagger-loadtester
